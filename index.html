<title>Star Cinema</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500&family=Roboto:wght@300&family=Readex+Pro:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style type="text/css">
body {
padding:0;
margin:0;
user-select:none;
list-style:none;
background:#fff;
font-family: 'Readex Pro', sans-serif;
}
header {
background:#26ab56;
padding:0 15px;
color:#fff;
margin-bottom:10px;
position:fixed;
top:0;
height:60px;
width:100%;
box-shadow: 0px 0px 7px black;
z-index:10;
display: flex;
align-items: center;
justify-content: space-between;
box-sizing: border-box;
}
h3 {
text-align:right;
font-size:medium;
font-weight:200;
margin:0;
color: #fff;
}
/* تنسيق زر الريلود */
.reload-btn {
background: rgba(255, 255, 255, 0.2);
border: none;
color: #fff;
padding: 6px 10px;
border-radius: 6px;
cursor: pointer;
font-size: 13px;
display: flex;
align-items: center;
gap: 5px;
font-family: 'Readex Pro', sans-serif;
}
.reload-btn:active {
background: rgba(0, 0, 0, 0.3);
}
#page:hover {
background:none;
}
#page {
margin-top:75px;
width:98%;
padding-right:4px;
padding-left:2px;
}
#page a:hover {
background:#111;
}
#page a {
width:110px;
border:2px solid #2ecb66;
height:120px;
display:inline-block;
border-radius:8px;
margin-bottom:10px;
text-decoration:none;
position: relative;
overflow: hidden;
}
#page a img {
height:120px;
margin-right:0px;
width:100%;
border-radius:8px;
}
#page a .episode-title {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(128, 0, 0);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    padding: 4px 0;
    margin: 0;
}
</style>
</head>
<!-- BY MoCreators -->
<body>
<header>
    <h3>Star Cinema</h3>
    <!-- زر الريلود (إعادة تحميل الصفحة) -->
    <button class="reload-btn" onclick="location.reload();">
        <i class="fa fa-refresh"></i> تحديث
    </button>
</header>
<!-- BY MoCreators -->
<div id="page">
